name: Pull Requests

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      skip-compare-performance:
        description: '🦆 Performance'
        type: boolean
        default: false
      examples-branch:
        description: 'ip-intelligence-dotnet-examples branch to test against (empty = main)'
        type: string
        default: ''

jobs:
  PullRequests:
    name: Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@feature/examples-branch-input
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      cache-assets: true
      skip-compare-performance: ${{ inputs.skip-compare-performance || false }}
      examples-branch: ${{ inputs.examples-branch || '' }}
      build-test-timeout-minutes: 300
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }} # for examples
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
      TestResourceKey: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
      AcceptCHBrowserKey: ${{ secrets.ACCEPTCH_BROWSER_KEY}}
      AcceptCHHardwareKey: ${{ secrets.ACCEPTCH_HARDWARE_KEY}}
      AcceptCHPlatformKey: ${{ secrets.ACCEPTCH_PLATFORM_KEY}}
      AcceptCHNoneKey: ${{ secrets.ACCEPTCH_NONE_KEY}}
